name: Build MarkdownStyle plugin

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - 'QuickLook.Plugin.MarkdownStyle/**'
      - '.github/workflows/build-markdown-style.yml'
  pull_request:
    paths:
      - 'QuickLook.Plugin.MarkdownStyle/**'
      - '.github/workflows/build-markdown-style.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v0.1.0). Leave empty to only build.'
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # only used to create a release
    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag }}
    defaults:
      run:
        working-directory: QuickLook.Plugin.MarkdownStyle
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Stamp version from tag
        if: env.RELEASE_TAG != ''
        shell: pwsh
        run: |
          $xml = [xml](Get-Content QuickLook.Plugin.Metadata.config)
          $xml.Metadata.Version = $env:RELEASE_TAG.TrimStart('v')
          $xml.Save("$PWD\QuickLook.Plugin.Metadata.config")

      - name: Build
        run: dotnet build QuickLook.Plugin.MarkdownStyle.csproj -c Release

      - name: Pack .qlplugin
        shell: pwsh
        run: ./Scripts/pack-zip.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: QuickLook.Plugin.MarkdownStyle
          path: QuickLook.Plugin.MarkdownStyle/QuickLook.Plugin.MarkdownStyle.qlplugin
          if-no-files-found: error

      - name: Create release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: QuickLook.Plugin.MarkdownStyle/QuickLook.Plugin.MarkdownStyle.qlplugin
